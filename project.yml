name: NetworkAnalyst
options:
  bundleIdPrefix: com.developer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  NetworkCore:
    path: NetworkCore

targets:
  NetworkAnalyst:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NetworkAnalyst
    dependencies:
      - package: NetworkCore
    settings:
      base:
        PRODUCT_NAME: NetworkAnalyst
        PRODUCT_BUNDLE_IDENTIFIER: com.developer.NetworkAnalyst
        INFOPLIST_FILE: NetworkAnalyst/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetworkAnalyst/Resources/NetworkAnalyst.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  NetworkAnalystTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NetworkCore/Tests/NetworkCoreTests
      - path: NetworkCore/Sources/NetworkCore
    dependencies:
      - target: NetworkAnalyst
    settings:
      base:
        PRODUCT_NAME: NetworkAnalystTests
        PRODUCT_BUNDLE_IDENTIFIER: com.developer.NetworkAnalystTests
        GENERATE_INFOPLIST_FILE: YES
