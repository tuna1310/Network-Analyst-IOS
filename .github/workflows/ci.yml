name: Network Analyst iOS CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test on macOS
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Select Xcode 15 / 16
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p
          xcodebuild -version
          
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          
      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la NetworkAnalyst.xcodeproj
          
      - name: Run NetworkCore Swift Package Unit Tests
        run: |
          swift test --package-path NetworkCore
          
      - name: Build & Run iOS Simulator Unit Tests
        run: |
          set -o pipefail
          xcodebuild clean test \
            -project NetworkAnalyst.xcodeproj \
            -scheme NetworkAnalystTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild clean test \
            -project NetworkAnalyst.xcodeproj \
            -scheme NetworkAnalystTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
